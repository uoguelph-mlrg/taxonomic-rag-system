[project.optional-dependencies]
# CPU version: use to local development or CI
cpu = [
    "torch==2.6.0",
    "torchvision==0.21.0",
]

# GPU version
gpu = [
    "torch==2.6.0+cu118",
    "torchvision==0.21.0+cu118",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"  
url = "https://download.pytorch.org/whl/cu118"
explicit = true

# designate sources for torch and torchvision
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" }, 
    { index = "pytorch-cu118", extra = "gpu" }  
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "gpu" }
]
# Pillow will get the latest version from the default PyPI

# use unsafe-best-match to solve dependency conflicts
[tool.uv]
index-strategy = "unsafe-best-match"
default-groups = ["dev", "docs"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]

[project]
name = "taxonomic-rag-system"
version = "0.1.0"
description = "A taxonomic system using image captioining and RAG"
readme = "README.md"
authors = [ {name = "Nate Lesperance", email = "lesperan@uoguelph.ca"}]
license = "Apache-2.0"
repository = "https://github.com/uoguelph-mlrg/taxonomic-rag-system"
requires-python = ">=3.12"
dependencies = [
    "backoff>=2.2.1",
    "instructor>=1.7.9",
    "pillow==11.2.1",
    "pydantic>=2.11.3",
    "ragas>=0.2.15",
    "scikit-learn>=1.6.1",
    "sentence-transformers>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "nbqa>=1.9.1",
    "pip-audit>=2.7.3",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.2",
]
docs = [
    "jinja2>=3.1.6", # Pinning version to address vulnerability GHSA-cpwx-vrp4-4pq7
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.15",
    "mkdocstrings>=0.24.1",
    "mkdocstrings-python>=1.10.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
]

# Default dependency groups to be installed
#[tool.uv]
#default-groups = ["dev", "docs"]

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
install_types = true
pretty = true
namespace_packages = true
explicit_package_bases = true
non_interactive = true
warn_unused_configs = true
allow_any_generics = false
allow_subclassing_any = true
allow_untyped_calls = true
allow_untyped_defs = false
allow_incomplete_defs = false
check_untyped_defs = true
allow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.ruff]
include = ["*.py", "pyproject.toml", "*.ipynb"]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "W", # pycodestyle
    "N", # pep8-naming
    "ERA", # eradicate
    "PL", # pylint
]
fixable = ["A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE", "D", "E", "F", "I", "W", "N", "ERA", "PL"]
ignore = [
    "B905", # `zip()` without an explicit `strict=` parameter
    "E501", # line too long
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "PLR2004", # Replace magic number with named constant
    "PLR0913", # Too many arguments
    "COM812", # Missing trailing comma
]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
markers = [
    "integration_test: marks tests as integration tests",
]

[tool.typos]
files.extend-exclude = [
  '**/data/**',
  '**/*.log'
]

# Ensure py.typed is included
[tool.hatch.build.targets.wheel.shared-data]
"src/taxonomic_rag_system/py.typed" = "taxonomic_rag_system/py.typed"
